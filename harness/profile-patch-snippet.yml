# ── Minecraft 聊天唤醒（dsh-mc-chat 插件） ──
# 常驻连接 mcagent 的 WebSocket：玩家在游戏里说话时，用 agent.followup 注入一条
# 会话消息并起一轮 —— 和定时提醒、后台任务结束通知走同一个入口。
#
# 配置路径不需要写死。插件按以下顺序查找 mcagent.json：
#   1. 本片段里的 config.configPath
#   2. 环境变量 MCAGENT_CONFIG
#   3. 当前工作目录下的 config/mcagent.json
# 如果 DSH 不是从游戏实例目录启动的，取消下一行注释并填实际路径：
#
#   config:
#     configPath: 'E:\Minecraft\.minecraft\versions\1.21.1(1)\.minecraft\config\mcagent.json'
#
# 卸载：删除本 insert 块，并删掉 profiles/desktop/node_modules/dsh-mc-chat
#       与 package.json 里的 dsh-mc-chat 依赖行。
- insert:
    - id: mc-chat
      name: dsh-mc-chat
