# ── Minecraft 聊天唤醒（dsh-mc-chat 插件） ──
# 常驻连接 mcagent 的 WebSocket：玩家在游戏里说话时，用 agent.followup 注入一条
# 会话消息并起一轮 —— 和定时提醒、后台任务结束通知走同一个入口。
#
# 配置路径不用写。运行中的游戏会在 ~/.mcagent/active.json 写下自己的配置路径，
# 插件按这个指针跟随，所以换实例、开第二个实例都不用改这里。
# 查找顺序：
#   1. 本片段里的 config.configPath（需要强制指定时才写）
#   2. 环境变量 MCAGENT_CONFIG
#   3. ~/.mcagent/active.json（游戏自己写的指针）
#   4. 当前目录下的 config/agentinminecraft.json
#
# 卸载：删除本 insert 块，并删掉 profiles/desktop/node_modules/dsh-mc-chat
#       与 package.json 里的 dsh-mc-chat 依赖行。
- insert:
    - id: mc-chat
      name: dsh-mc-chat
