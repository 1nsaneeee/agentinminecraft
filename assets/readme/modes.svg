<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">两种模式：work 与 chat</title>
  <desc id="d">work 模式可以改造世界，需要 allowWrite 打开；chat 模式只能让身体做动作，禁止直接改世界与传送。agent 无法自行切回 work，必须由玩家在游戏内输入。</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1522"/>
      <stop offset="1" stop-color="#0E1B2C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" fill="url(#bg2)"/>
  <text x="48" y="50" font-family="ui-monospace,Consolas,monospace" font-size="16" letter-spacing="2.2" fill="#7FC4E8" opacity="0.9">TWO MODES</text>

  <!-- work -->
  <g>
    <rect x="40" y="72" width="540" height="186" rx="18" fill="#111F31" stroke="#F2A24B" stroke-width="2"/>
    <rect x="64" y="94" width="132" height="36" rx="8" fill="rgba(242,162,75,.14)"/>
    <text x="78" y="118" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#F2A24B">/agent work</text>
    <text x="216" y="121" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#F4FAFF">成为创世神</text>

    <text x="64" y="172" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#A8CBE4">能放、能填、能执行命令、能传送</text>
    <text x="64" y="202" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#A8CBE4">改世界前需要 <tspan font-family="ui-monospace,Consolas,monospace" fill="#F2A24B">allowWrite=true</tspan></text>
    <text x="64" y="232" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#7A9CBB">区域编辑自动记录，可撤销 16 层</text>
  </g>

  <!-- chat -->
  <g>
    <rect x="620" y="72" width="540" height="186" rx="18" fill="#111F31" stroke="#7FC4E8" stroke-width="2"/>
    <rect x="644" y="94" width="132" height="36" rx="8" fill="rgba(127,196,232,.14)"/>
    <text x="658" y="118" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#7FC4E8">/agent chat</text>
    <text x="796" y="121" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#F4FAFF">坐在你旁边的游戏搭子</text>

    <text x="644" y="172" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#A8CBE4">保留身体的走、挖、放、用、打</text>
    <text x="644" y="202" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#A8CBE4">拒绝直接改世界、执行命令、传送</text>
    <text x="644" y="232" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#7A9CBB">连 WebSocket 的 exec 帧也拒绝</text>
  </g>

  <text x="48" y="304" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#7A9CBB">agent 自己切不回 work —— 只有你能在游戏里输入。</text>
</svg>
