[[mods]]
modId="agentinminecraft"
version="0.5.0-rc.3"
displayName="Agent In Minecraft"
authors="TomUWU"
description='''
Connect an external agent to a running Minecraft world through MCP over HTTP.
Inspect selections, recipes, machine state and installed mods. Perform authorized
edits, verify their results and undo supported changes. The server also exposes
player-like bodies for physical tasks. Local connections require the bridge token.
'''

