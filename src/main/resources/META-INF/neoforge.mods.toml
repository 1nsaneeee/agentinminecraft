[[mods]]
modId="mcagent"
version="0.3.0"
displayName="MC Agent Bridge"
authors="TomUWU"
description='''
Exposes the running game to an external AI agent: an MCP server over HTTP
(streamable-http) plus a live WebSocket channel for chat and game events.

Also gives the agent a body: a real server player with no client attached,
which walks with a jump-aware path, mines at vanilla speed, places, uses and
attacks. Loopback-only and token protected by default; chat mode keeps the
body's hands but refuses direct world edits.
'''

[[dependencies.mcagent]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.mcagent]]
modId="minecraft"
